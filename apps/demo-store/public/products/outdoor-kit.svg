<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="okBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#F1F5F9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="okLightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="okBodyDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="okShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <circle cx="250" cy="200" r="170" fill="url(#okBg)" />
  <ellipse cx="250" cy="345" rx="190" ry="24" fill="#E2E8F0" opacity="0.6" />

  <!-- Ground wash / Warm glow puddle -->
  <ellipse cx="250" cy="330" rx="140" ry="28" fill="#FDE047" opacity="0.3" filter="blur(8px)" />

  <!-- Bollard Pathway Light (Center-Left) -->
  <g transform="translate(130, 80)" filter="url(#okShadow)">
    <!-- Glow from upper lantern section -->
    <rect x="25" y="60" width="50" height="35" rx="4" fill="url(#okLightGlow)" />
    <!-- Architectural Top Cap -->
    <path d="M 15 60 L 85 60 L 75 40 L 25 40 Z" fill="url(#okBodyDark)" />
    <!-- Glass Shield / Diffuser -->
    <rect x="25" y="60" width="50" height="35" rx="2" fill="#FFFBEB" opacity="0.85" stroke="#475569" stroke-width="2" />
    <line x1="50" y1="60" x2="50" y2="95" stroke="#334155" stroke-width="2" />
    <!-- Lower Column Body -->
    <path d="M 28 95 L 72 95 L 75 240 L 25 240 Z" fill="url(#okBodyDark)" />
    <!-- Weatherproof Base Flange -->
    <rect x="18" y="240" width="64" height="14" rx="4" fill="#0F172A" />
  </g>

  <!-- Architectural Spotlight (Right) -->
  <g transform="translate(260, 110) rotate(-15)" filter="url(#okShadow)">
    <!-- Light cone projection -->
    <polygon points="120,40 240,-10 260,110" fill="#FEF08A" opacity="0.25" filter="blur(6px)" />
    <!-- Spotlight Cylinder Barrel -->
    <rect x="40" y="30" width="80" height="50" rx="12" fill="url(#okBodyDark)" />
    <!-- Front Lens Ring -->
    <ellipse cx="120" cy="55" rx="8" ry="24" fill="#FEF08A" stroke="#CBD5E1" stroke-width="2" />
    <ellipse cx="120" cy="55" rx="4" ry="18" fill="#FFFFFF" />
    <!-- Pivot Arm & Stake -->
    <path d="M 60 80 L 60 120 L 70 120 L 70 80 Z" fill="#334155" />
    <circle cx="65" cy="80" r="7" fill="#64748B" />
    <path d="M 60 120 L 70 120 L 65 190 Z" fill="#0F172A" />
  </g>

  <!-- IP67 Water Droplet Graphic Tag -->
  <g transform="translate(330, 240)" filter="url(#okShadow)">
    <rect x="0" y="0" width="100" height="40" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="20" cy="20" r="10" fill="#EFF6FF" />
    <path d="M 20 13 C 20 13 15 19 15 22 C 15 24.5 17.2 27 20 27 C 22.8 27 25 24.5 25 22 C 25 19 20 13 20 13 Z" fill="#0284C7" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">IP67 Rated</text>
  </g>
</svg>
