<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="skBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F8FAFC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="skBulbGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
    <linearGradient id="skMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="skShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="250" cy="200" r="170" fill="url(#skBg)" />
  <ellipse cx="250" cy="340" rx="180" ry="24" fill="#E2E8F0" opacity="0.6" />

  <!-- Bulb 1 (Left) -->
  <g transform="translate(110, 80) scale(0.65)" filter="url(#skShadow)">
    <circle cx="150" cy="150" r="90" fill="#FEF08A" opacity="0.3" />
    <path d="M 150 40 C 90 40 45 85 45 150 C 45 190 75 220 100 260 C 115 285 120 300 120 330 L 180 330 C 180 300 185 285 200 260 C 225 220 255 190 255 150 C 255 85 210 40 150 40 Z" fill="url(#skBulbGlow)" />
    <rect x="118" y="330" width="64" height="12" rx="3" fill="#D97706" />
    <path d="M 120 342 L 180 342 L 175 390 L 125 390 Z" fill="url(#skMetal)" />
    <ellipse cx="120" cy="90" rx="25" ry="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 120 90)" />
  </g>

  <!-- Bulb 2 (Center) -->
  <g transform="translate(200, 50) scale(0.75)" filter="url(#skShadow)">
    <circle cx="150" cy="150" r="110" fill="#FDE047" opacity="0.35" />
    <path d="M 150 40 C 90 40 45 85 45 150 C 45 190 75 220 100 260 C 115 285 120 300 120 330 L 180 330 C 180 300 185 285 200 260 C 225 220 255 190 255 150 C 255 85 210 40 150 40 Z" fill="url(#skBulbGlow)" />
    <rect x="118" y="330" width="64" height="12" rx="3" fill="#D97706" />
    <path d="M 120 342 L 180 342 L 175 390 L 125 390 Z" fill="url(#skMetal)" />
    <ellipse cx="120" cy="90" rx="25" ry="12" fill="#FFFFFF" opacity="0.7" transform="rotate(-30 120 90)" />
  </g>

  <!-- Controller (Right) -->
  <g transform="translate(300, 180) rotate(5)" filter="url(#skShadow)">
    <rect x="0" y="0" width="90" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="45" cy="45" r="24" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="45" cy="45" r="10" fill="#0F172A" />
    <rect x="18" y="85" width="54" height="16" rx="8" fill="#F1F5F9" />
    <rect x="18" y="108" width="54" height="16" rx="8" fill="#FEF3C7" />
  </g>

  <!-- Installation Guide Booklet (Bottom Left) -->
  <g transform="translate(90, 260) rotate(-8)" filter="url(#skShadow)">
    <rect x="0" y="0" width="85" height="65" rx="6" fill="#0F172A" />
    <text x="12" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" letter-spacing="1">LUMORA</text>
    <text x="12" y="36" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#94A3B8">Quick Guide</text>
    <rect x="12" y="46" width="30" height="3" rx="1.5" fill="#F59E0B" />
  </g>
</svg>
