<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background warm glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#E0E7FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Bulb glass glow gradient -->
    <radialGradient id="bulbGlow" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
      <stop offset="35%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9" />
    </radialGradient>

    <!-- Bulb outer rim gradient -->
    <linearGradient id="bulbRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Metallic Base Gradient -->
    <linearGradient id="metalBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#64748B" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Metal Accent Ring -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Controller Surface Gradient -->
    <linearGradient id="controllerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Controller Button Glow -->
    <radialGradient id="buttonLed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="heroBulbShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="40" flood-color="#D97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Stage Light -->
  <rect width="800" height="600" fill="url(#bgGlow)" />

  <!-- Pedestal Platform / Stage Base -->
  <ellipse cx="400" cy="510" rx="280" ry="42" fill="#E2E8F0" opacity="0.4" />
  <ellipse cx="400" cy="505" rx="230" ry="32" fill="#CBD5E1" opacity="0.5" />

  <!-- SECONDARY BULB (Left, slightly back) -->
  <g transform="translate(180, 160) scale(0.65)" filter="url(#softShadow)" opacity="0.9">
    <!-- Bulb Glass -->
    <path d="M 200 80 C 130 80 80 130 80 200 C 80 250 115 285 145 330 C 165 360 170 380 170 410 L 230 410 C 230 380 235 360 255 330 C 285 285 320 250 320 200 C 320 130 270 80 200 80 Z" fill="#FDE68A" opacity="0.85" />
    <ellipse cx="200" cy="180" rx="80" ry="80" fill="#FEF08A" opacity="0.6" />
    <!-- Neck Ring -->
    <rect x="170" y="410" width="60" height="15" rx="3" fill="url(#goldAccent)" />
    <!-- Metal Base -->
    <path d="M 172 425 L 228 425 L 222 475 L 178 475 Z" fill="url(#metalBase)" />
    <path d="M 180 475 L 220 475 L 210 500 L 190 500 Z" fill="#334155" />
  </g>

  <!-- MAIN HERO BULB (Center-Right, prominent) -->
  <g transform="translate(260, 40)" filter="url(#heroBulbShadow)">
    <!-- Radial Outer Glow Aura -->
    <circle cx="200" cy="190" r="170" fill="#FEF08A" opacity="0.35" />
    <circle cx="200" cy="190" r="130" fill="#FDE047" opacity="0.25" />

    <!-- Bulb Glass Outer Body -->
    <path d="M 200 60 C 110 60 45 125 45 210 C 45 270 90 315 128 370 C 152 405 158 430 158 465 L 242 465 C 242 430 248 405 272 370 C 310 315 355 270 355 210 C 355 125 290 60 200 60 Z" fill="url(#bulbGlow)" stroke="url(#bulbRim)" stroke-width="3" />

    <!-- Filament / Core Light Capsule -->
    <ellipse cx="200" cy="200" rx="65" ry="90" fill="#FFFFFF" opacity="0.9" filter="blur(6px)" />
    <path d="M 180 230 C 180 170 200 140 200 140 C 200 140 220 170 220 230" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <circle cx="200" cy="140" r="10" fill="#FFFFFF" />

    <!-- Top Highlight Glare -->
    <ellipse cx="155" cy="125" rx="35" ry="18" fill="#FFFFFF" opacity="0.55" transform="rotate(-30 155 125)" />

    <!-- Accent Gold Collar Ring -->
    <rect x="156" y="465" width="88" height="18" rx="4" fill="url(#goldAccent)" />

    <!-- Sleek Matte Metal Base -->
    <path d="M 158 483 L 242 483 L 235 550 L 165 550 Z" fill="url(#metalBase)" />
    <!-- Screw Threads -->
    <line x1="161" y1="498" x2="239" y2="498" stroke="#1E293B" stroke-width="3" opacity="0.4" />
    <line x1="163" y1="514" x2="237" y2="514" stroke="#1E293B" stroke-width="3" opacity="0.4" />
    <line x1="165" y1="530" x2="235" y2="530" stroke="#1E293B" stroke-width="3" opacity="0.4" />

    <!-- Base Contact -->
    <path d="M 172 550 L 228 550 L 218 572 L 182 572 Z" fill="#0F172A" />
  </g>

  <!-- CONTROLLER / REMOTE (Front Left, angled perspective) -->
  <g transform="translate(140, 310) rotate(-6)" filter="url(#softShadow)">
    <!-- Controller Body -->
    <rect x="0" y="0" width="130" height="210" rx="20" fill="url(#controllerBody)" stroke="#E2E8F0" stroke-width="2" />

    <!-- Magnetic Mount Shadow / Edge -->
    <rect x="4" y="4" width="122" height="202" rx="17" fill="none" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Dimmer Dial / Control Ring -->
    <circle cx="65" cy="65" r="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="65" cy="65" r="26" fill="#FFFFFF" />
    <!-- Brightness ticks -->
    <circle cx="65" cy="38" r="3" fill="#38BDF8" />
    <circle cx="85" cy="45" r="2.5" fill="#94A3B8" />
    <circle cx="92" cy="65" r="2.5" fill="#94A3B8" />
    <circle cx="38" cy="65" r="2.5" fill="#94A3B8" />

    <!-- Power / Scene Button -->
    <circle cx="65" cy="65" r="14" fill="#0F172A" />
    <!-- Glowing Power Symbol -->
    <path d="M 65 58 L 65 64 M 61 61 A 5 5 0 1 0 69 61" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Scene Preset Buttons (4 pill buttons) -->
    <rect x="25" y="120" width="80" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="65" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">READ · 4000K</text>

    <rect x="25" y="152" width="80" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="65" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle" letter-spacing="0.5">RELAX · 2700K</text>

    <!-- Brand Logo Mark on controller -->
    <circle cx="65" cy="192" r="3" fill="#94A3B8" opacity="0.6" />
  </g>

  <!-- FLOATING FEATURE BADGE (Right side) -->
  <g transform="translate(560, 260)" filter="url(#softShadow)">
    <rect x="0" y="0" width="180" height="66" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
    <!-- Color Wheel Icon -->
    <circle cx="34" cy="33" r="18" fill="#F8FAFC" />
    <circle cx="34" cy="33" r="12" stroke="url(#bulbGlow)" stroke-width="4" fill="none" />
    <circle cx="34" cy="33" r="4" fill="#0F172A" />

    <text x="64" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">16 Million Colors</text>
    <text x="64" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Circadian Sync Ready</text>
  </g>

  <!-- FLOATING CONNECTIVITY BADGE (Left side) -->
  <g transform="translate(60, 210)" filter="url(#softShadow)">
    <rect x="0" y="0" width="170" height="60" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
    <!-- Wireless signal icon -->
    <circle cx="32" cy="30" r="16" fill="#EFF6FF" />
    <path d="M 26 34 A 8 8 0 0 1 38 34 M 23 37 A 12 12 0 0 1 41 37 M 32 31 A 1 1 0 1 1 32 31.01" stroke="#0284C7" stroke-width="2" stroke-linecap="round" fill="none" />

    <text x="58" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Instant Bluetooth</text>
    <text x="58" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Zero-Hub Setup</text>
  </g>
</svg>
