<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="pkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F8FAFC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pkBulbGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#10B981" />
    </radialGradient>
    <radialGradient id="pkBulbBlue" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </radialGradient>
    <linearGradient id="pkHubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="pkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <circle cx="250" cy="200" r="170" fill="url(#pkBg)" />
  <ellipse cx="250" cy="340" rx="190" ry="24" fill="#E2E8F0" opacity="0.6" />

  <!-- Bulb 1 (Left Cyan/Blue) -->
  <g transform="translate(60, 90) scale(0.55)" filter="url(#pkShadow)">
    <circle cx="150" cy="150" r="90" fill="#93C5FD" opacity="0.4" />
    <path d="M 150 40 C 90 40 45 85 45 150 C 45 190 75 220 100 260 C 115 285 120 300 120 330 L 180 330 C 180 300 185 285 200 260 C 225 220 255 190 255 150 C 255 85 210 40 150 40 Z" fill="url(#pkBulbBlue)" />
    <rect x="118" y="330" width="64" height="12" rx="3" fill="#2563EB" />
    <path d="M 120 342 L 180 342 L 175 390 L 125 390 Z" fill="#334155" />
  </g>

  <!-- Bulb 2 (Mid-Left Warm Gold) -->
  <g transform="translate(130, 60) scale(0.6)" filter="url(#pkShadow)">
    <circle cx="150" cy="150" r="90" fill="#FDE047" opacity="0.4" />
    <path d="M 150 40 C 90 40 45 85 45 150 C 45 190 75 220 100 260 C 115 285 120 300 120 330 L 180 330 C 180 300 185 285 200 260 C 225 220 255 190 255 150 C 255 85 210 40 150 40 Z" fill="#FDE047" />
    <rect x="118" y="330" width="64" height="12" rx="3" fill="#D97706" />
    <path d="M 120 342 L 180 342 L 175 390 L 125 390 Z" fill="#334155" />
  </g>

  <!-- Bulb 3 (Mid-Right Emerald/Green) -->
  <g transform="translate(290, 60) scale(0.6)" filter="url(#pkShadow)">
    <circle cx="150" cy="150" r="90" fill="#86EFAC" opacity="0.4" />
    <path d="M 150 40 C 90 40 45 85 45 150 C 45 190 75 220 100 260 C 115 285 120 300 120 330 L 180 330 C 180 300 185 285 200 260 C 225 220 255 190 255 150 C 255 85 210 40 150 40 Z" fill="url(#pkBulbGlow)" />
    <rect x="118" y="330" width="64" height="12" rx="3" fill="#059669" />
    <path d="M 120 342 L 180 342 L 175 390 L 125 390 Z" fill="#334155" />
  </g>

  <!-- Central Pro Smart Hub -->
  <g transform="translate(195, 175)" filter="url(#pkShadow)">
    <!-- Hub Cylinder -->
    <path d="M 0 45 C 0 20 25 0 55 0 C 85 0 110 20 110 45 L 110 110 C 110 135 85 155 55 155 C 25 155 0 135 0 110 Z" fill="url(#pkHubGrad)" />
    <!-- Top Cap -->
    <ellipse cx="55" cy="40" rx="55" ry="22" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <!-- Top LED Status Ring -->
    <ellipse cx="55" cy="38" rx="42" ry="16" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.9" />
    <ellipse cx="55" cy="38" rx="36" ry="13" fill="#0F172A" />
    <!-- Center Logo / Icon -->
    <circle cx="55" cy="38" r="4" fill="#38BDF8" />
    <text x="55" y="105" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">LUMORA HUB</text>
  </g>

  <!-- Controllers (2 front remotes) -->
  <g transform="translate(120, 220) rotate(-12)" filter="url(#pkShadow)">
    <rect x="0" y="0" width="65" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="32.5" cy="32" r="16" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="32.5" cy="32" r="6" fill="#0F172A" />
  </g>
  <g transform="translate(330, 210) rotate(10)" filter="url(#pkShadow)">
    <rect x="0" y="0" width="65" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="32.5" cy="32" r="16" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="32.5" cy="32" r="6" fill="#0F172A" />
  </g>
</svg>
